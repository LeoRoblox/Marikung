function icon(name,size=18){return `<i data-lucide="${name}" width="${size}" height="${size}"></i>`}
function refreshIcons(){if(window.lucide) lucide.createIcons()}
function toast(msg,type=''){document.getElementById('toastRoot').innerHTML=`<div class="toast ${type}">${icon(type==='danger'?'circle-alert':'check-circle-2',16)} ${esc(msg)}</div>`}
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function avatar(u,size=34){return u?.profile?`<img src="${u.profile}" alt="" class="avatar" style="width:${size}px;height:${size}px">`:`<div class="avatar" style="width:${size}px;height:${size}px">${esc((u?.username||'?').slice(0,2).toUpperCase())}</div>`}
function renderAuth(){ if(!state.current){renderAuthScreen();} else renderApp(); }
function renderAuthScreen(mode=window.authMode||'register'){
 window.authMode=mode;
 const reg=mode==='register';
 document.getElementById('app').innerHTML=`<div class="auth-wrap fade-in"><div class="auth-card">
   <div class="auth-top"><div class="brand-mark">${icon('command',19)}</div><div><strong>AR Workspace</strong><div class="muted small">Smooth • lokal • dark glass</div></div></div>
   <h1>${reg?'Registrieren':'Anmelden'}</h1><div class="sub">${reg?'Erstelle deinen Zugang mit einem gültigen Beitritts-Code.':'Melde dich mit deinem Benutzernamen und Passwort an.'}</div>
   <form id="authForm" class="stack">
    <div class="field"><label>Benutzername</label><input id="authUser" class="input" autocomplete="username" placeholder="z. B. max.mustermann" required></div>
    ${reg?`<div class="field"><label>Beitritts-Code</label><input id="authCode" class="input" inputmode="numeric" maxlength="19" placeholder="Code eingeben" required></div>`:`<div class="field"><label>Passwort</label><div style="display:flex;gap:8px"><input id="authPass" class="input" type="password" autocomplete="current-password"><button class="icon-btn" id="toggleAuthPass" type="button" title="Passwort anzeigen">${icon('eye',18)}</button></div></div>`}
    <button class="primary btn-wide" type="submit">${icon(reg?'user-plus':'log-in',17)} ${reg?'Registrieren':'Anmelden'}</button>
   </form>
   <div class="auth-link">${reg?'Du hast schon einen Account?':'Du hast noch keinen Account?'} <button id="switchAuth">${reg?'Melde dich hier an.':'Registriere dich hier.'}</button></div>
   ${reg?`<div class="auth-note">Beim Registrieren wird zuerst der Code geprüft. Danach wird dein Zugang eingerichtet.</div>`:`<div class="auth-note">Benutze deinen Benutzernamen und – sofern erforderlich – dein Passwort.</div>`}
 </div></div>`;
 document.getElementById('switchAuth').onclick=()=>renderAuthScreen(reg?'login':'register');
 if(!reg){
   document.getElementById('toggleAuthPass').onclick=()=>{let x=document.getElementById('authPass');x.type=x.type==='password'?'text':'password';document.getElementById('toggleAuthPass').innerHTML=icon(x.type==='password'?'eye':'eye-off',18);refreshIcons()}
 }
 document.getElementById('authForm').onsubmit=async e=>{
   e.preventDefault();
   await pullRemoteState();
   let username=document.getElementById('authUser').value.trim();
   if(!reg){
     let u=state.users.find(x=>x.username.toLowerCase()===username.toLowerCase());
     if(!u)return toast('Benutzername oder Passwort ist falsch.','danger');
     if(u.suspended)return toast('Dieser Account ist gesperrt.','danger');
     if(u.devices.length>=3 && !u.devices.includes(getDeviceId()))return toast('Maximal 3 Geräte erreicht.','danger');
     // Owner login uses only the username. The password field stays visible but is not required for this account.
     if(u.username===OWNER){
       if(!u.devices.includes(getDeviceId()))u.devices.push(getDeviceId());
       state.current=u.id;save();renderApp();return;
     }
     let pass=document.getElementById('authPass').value;
     if(!pass || await hash(pass)!==u.password)return toast('Benutzername oder Passwort ist falsch.','danger');
     if(!u.devices.includes(getDeviceId()))u.devices.push(getDeviceId());
     state.current=u.id;save();renderApp();return;
   }
   let code=document.getElementById('authCode').value.trim();
   // Always refresh the shared database before checking a code so registrations work on every device.
   await refreshRemoteBeforeAuth();
   // Special one-time owner entry. It is consumed after the owner account is created.
   if(username.toLowerCase()===OWNER.toLowerCase() && code===OWNER_ENTRY_CODE){
     let used=state.codes.some(x=>x.code===OWNER_ENTRY_CODE && x.used);
     if(used)return toast('Dieser Beitritts-Code ist ungültig oder bereits benutzt.','danger');
     let existing=state.users.find(x=>x.username.toLowerCase()===OWNER.toLowerCase());
     if(existing)return toast('Dieser Account wurde bereits erstellt.','danger');
     let u={id:uid(),username:OWNER,password:'',passwordPlain:'',role:'Owner',profile:'',idNo:'AR-'+Math.floor(100000+Math.random()*900000),suspended:false,warnings:[],devices:[getDeviceId()],createdAt:now()};
     state.users.push(u);
     state.codes.push({id:uid(),code:OWNER_ENTRY_CODE,username:OWNER,used:true,usedBy:u.id,usedAt:now(),special:true});
     state.current=u.id;save();await pushRemoteState();renderApp();toast('Account wurde erstellt.','success');return;
   }
   let c=state.codes.find(x=>x.code===code&&!x.used);
   if(!c){
     try{
       const remote=await firebaseGet(FIREBASE_STATE_PATH);
       if(remote&&typeof remote==='object'){
         const current=state.current||null;
         state={...state,...remote,current};
         c=state.codes.find(x=>x.code===code&&!x.used);
       }
     }catch(e){
       return toast('Firebase ist nicht erreichbar. Prüfe die Realtime-Database-Regeln.','danger');
     }
   }
   if(!c)return toast('Dieser Beitritts-Code ist ungültig oder bereits benutzt.','danger');
   if(c.username && c.username.toLowerCase()!==username.toLowerCase())return toast('Dieser Code ist für einen anderen Benutzernamen vorgesehen.','danger');
   if(username.toLowerCase()===OWNER.toLowerCase())return toast('Benutzername ist bereits vergeben.','danger');
   if(state.users.some(x=>x.username.toLowerCase()===username.toLowerCase()))return toast('Benutzername ist bereits vergeben.','danger');
   openRegisterPassword(username,c);
 };
 refreshIcons();
}
function getDeviceId(){let x=localStorage.getItem('ar_device_id');if(!x){x=uid();localStorage.setItem('ar_device_id',x)}return x}
function openRegisterPassword(username,code){openModal(`<div class="modal center"><div class="modal-head"><h2>Passwort festlegen</h2><button class="close" data-close>${icon('x',17)}</button></div><div class="stack"><div class="field"><label>Benutzername</label><input class="input" value="${esc(username)}" disabled></div><div class="field"><label>Passwort</label><input id="newPass" class="input" type="password" minlength="6" placeholder="mindestens 6 Zeichen"></div><button id="createAccount" class="primary btn-wide">${icon('user-plus',17)} Account erstellen</button></div></div>`,'center');
 document.getElementById('createAccount').onclick=async()=>{await pullRemoteState();let p=document.getElementById('newPass').value;if(p.length<6)return toast('Passwort muss mindestens 6 Zeichen haben.','danger');let c=state.codes.find(x=>x.code===code&&!x.used);if(!c)return toast('Code wurde bereits verwendet.','danger');let u={id:uid(),username,password:await hash(p),passwordPlain:p,role:'User',profile:'',idNo:'AR-'+Math.floor(100000+Math.random()*900000),suspended:false,warnings:[],devices:[getDeviceId()],createdAt:now()};state.users.push(u);c.used=true;c.usedBy=u.id;c.usedAt=now();state.current=u.id;localStorage.setItem('ar_workspace_state',JSON.stringify(state));const ok=await pushRemoteState();if(!ok){state.users=state.users.filter(x=>x.id!==u.id);c.used=false;delete c.usedBy;delete c.usedAt;state.current=null;localStorage.setItem('ar_workspace_state',JSON.stringify(state));return toast('Registrierung konnte nicht gespeichert werden. Prüfe die Firebase-Realtime-Database-Regeln.','danger')}closeModal();renderApp();toast('Account wurde erstellt.','success')};refreshIcons()}
function renderApp(){document.getElementById('app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">${icon('command',18)}</div><strong>AR Workspace</strong></div><nav class="nav">${navItems().map(([v,i,l])=>`<button class="${view===v?'active':''}" data-nav="${v}">${icon(i,18)}<span>${l}</span></button>`).join('')}</nav><div class="sidebar-spacer"></div><div class="mini-user"><div class="row">${avatar(me())}<div style="min-width:0"><div style="font-size:12px;font-weight:650;overflow:hidden;text-overflow:ellipsis">${esc(me().username)}</div><small>${esc(me().role)}</small></div></div></div><button class="side-action" id="logout" style="margin-top:6px">${icon('log-out',17)} <span>Ausloggen</span></button></aside><main class="main"><div class="topbar"><div class="breadcrumbs"><span>Workspace</span>${subview?`<span>›</span><strong>${esc(pageTitle())}</strong>`:''}</div><div class="top-switch ${view==='dashboard'||view==='tasks'?'':'right'}"><div class="dot"></div></div><div class="top-actions"><button class="ghost" id="openSettings">${icon('settings-2',16)} Einstellungen</button><button class="ghost" id="openCard">${icon('badge-check',16)} Ausweis</button></div></div><div class="content" id="content"></div></main></div><div class="mobile-nav">${navItems().map(([v,i,l])=>`<button class="${view===v?'active':''}" data-nav="${v}">${icon(i,16)}<span>${l}</span></button>`).join('')}</div>`;
 document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{view=b.dataset.nav;subview='';renderApp()});document.getElementById('openSettings').onclick=()=>openSettings();document.getElementById('openCard').onclick=()=>openIdCard();document.getElementById('logout').onclick=logout;renderView();refreshIcons();}
function pageTitle(){return ({dashboard:'Dashboard',tasks:'Aufgaben',reports:'Berichte',more:'Mehr'}[view]||'')}
function renderView(){let el=document.getElementById('content');if(view==='dashboard')el.innerHTML=dashboardView();if(view==='tasks')el.innerHTML=tasksView();if(view==='reports')el.innerHTML=reportsView();if(view==='more')el.innerHTML=adminView();bindView();refreshIcons()}
function dashboardView(){let u=me(),warns=u.warnings||[];let allTasks=state.tasks.length,done=state.tasks.filter(t=>t.status?.[u.id]==='Ja').length;let abs=visibleAbsences().slice(0,3);return `<div class="page-head"><div><h1>Hallo, ${esc(u.username)}</h1><p>Alles an einem Ort – Aufgaben, Arbeitsplan, Berichte und mehr.</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="ghost" id="foldersBtn">${icon('folders',17)} Ordners</button><button class="ghost" id="absenceTopBtn">${icon('calendar-x-2',17)} Abwesenheit</button><button class="primary" id="scheduleBtn">${icon('calendar-days',17)} Arbeitsplan</button></div></div><div class="grid cards"><div class="card"><div class="stat-icon">${icon('list-checks',18)}</div><div class="muted small">Aufgaben</div><div class="metric">${allTasks}</div></div><div class="card"><div class="stat-icon">${icon('check-circle-2',18)}</div><div class="muted small">Erledigt</div><div class="metric">${done}</div></div><div class="card"><div class="stat-icon">${icon('triangle-alert',18)}</div><div class="muted small">Warnungen</div><div class="metric">${warns.length}</div></div><div class="card"><div class="stat-icon">${icon('calendar-check-2',18)}</div><div class="muted small">Abwesenheiten</div><div class="metric">${visibleAbsences().length}</div></div></div>${warns.length?`<div class="section-title"><h2>Warnungen</h2><span class="pill warn">${warns.length}/5</span></div><div class="list">${warns.length>1?`<div class="item warn-card" data-all-warns="${esc(u.id)}" style="cursor:pointer"><div class="left">${icon('triangle-alert',20)}<div><div class="title">${warns.length} Warnungen</div><div class="meta">Tippe hier, um alle Warnungen anzuzeigen.</div></div></div><div class="right">${icon('chevron-right',16)}</div></div>`:warns.map((w,i)=>`<div class="item warn-card" data-all-warns="${esc(u.id)}" style="cursor:pointer"><div class="left">${icon(w.icon||'circle-alert',20)}<div><div class="title">${esc(w.title)}</div><div class="meta">${esc(w.description)}</div><div class="warn-num">(${i+1}/5)</div></div></div><div class="right">${icon('chevron-right',16)}</div></div>`).join('')}</div>`:''}<div class="section-title"><h2>Heute</h2></div><div class="grid two"><div class="card"><div class="section-title" style="margin-top:0"><h2>Arbeitsplan</h2><button class="ghost" id="scheduleBtn2">${icon('arrow-right',14)}</button></div>${miniSchedule()}</div><div class="card"><div class="section-title" style="margin-top:0"><h2>Abwesenheit</h2><button class="ghost" id="absenceBtn">${icon('plus',14)} Hinzufügen</button></div><div class="list">${abs.map(a=>`<div class="item"><div class="left">${icon(a.private?'lock':'calendar-x-2',17)}<div><div class="title">${esc(a.username)}</div><div class="meta">bis ${esc(a.until)}${a.private?' • privat':''}</div></div></div><div class="right">${u.username===OWNER?`<button class="icon-btn" data-delete-absence="${a.id}" title="Abwesenheit löschen">${icon('trash-2',15)}</button>`:''}</div></div>`).join('')||'<div class="empty">Keine sichtbaren Abwesenheiten.</div>'}</div></div></div>`}
function miniSchedule(){return `<div class="stack">${Array.from({length:8},(_,i)=>{let any=DAYS.some(d=>state.schedule[i+1]?.[d]?.work);return `<div class="item" style="padding:10px 12px"><div class="left">${icon('clock-3',15)}<div><div class="title">${i+1}. Stunde</div><div class="meta">${any?'Einträge vorhanden':'Frei'}</div></div></div><span class="pill">${any?'Belegt':'Frei'}</span></div>`}).join('')}</div>`}
function openSchedule(){openModal(`<div class="modal"><div class="handle"></div><div class="modal-head"><h2>Arbeitsplan</h2><button class="close" data-close>${icon('x',17)}</button></div><p class="muted small">Klicke auf ein Feld. Owner/Manager können Arbeit und Beschreibung pflegen. Beschreibung wird für normale Nutzer erst im Detail angezeigt.</p><div class="schedule-wrap"><div class="schedule"><div class="cell head"></div>${DAYS.map(d=>`<div class="cell head">${d.slice(0,2)}</div>`).join('')}${Array.from({length:8},(_,i)=>`<div class="cell hour">${i+1}. Stunde</div>${DAYS.map(d=>{let c=state.schedule[i+1]?.[d];return `<div class="cell clickable" data-schedule="${i+1}|${esc(d)}">${c?.work?`<strong>${esc(c.work)}</strong><span>${canManage()?'': 'Tippen für Beschreibung'}</span>`:'<span>Frei</span>'}</div>`}).join('')}`).join('')}</div></div></div>`);document.querySelectorAll('[data-schedule]').forEach(x=>x.onclick=()=>{let [hour,day]=x.dataset.schedule.split('|');openScheduleCell(+hour,day)});refreshIcons()}
function openScheduleCell(hour,day){let c=clone(state.schedule[hour]?.[day]||{});let editing=canManage();openModal(`<div class="modal ${editing?'':'center'}"><div class="modal-head"><h2>${hour}. Stunde • ${esc(day)}</h2><button class="close" data-close>${icon('x',17)}</button></div><div class="stack"><div class="field"><label>Arbeit</label><input id="schWork" class="input" value="${esc(c.work||'')}" ${editing?'':'disabled'}></div><div class="field"><label>Beschreibung</label><textarea id="schDesc" class="textarea" ${editing?'':'disabled'}>${esc(c.description||'')}</textarea></div><div class="field"><label>Stunde</label><select id="schHour" class="input">${Array.from({length:8},(_,i)=>`<option ${i+1===hour?'selected':''}>${i+1}</option>`).join('')}</select></div>${editing?`<div class="form-actions"><button id="schDelete" class="danger">${icon('trash-2',15)} Löschen</button><button id="schSave" class="primary">${icon(c.work?'pencil':'save',15)} ${c.work?'Bearbeiten':'Speichern'}</button></div>`:'<div class="form-actions"><button class="ghost" data-close>Schließen</button></div>'}</div></div>`);if(editing){document.getElementById('schSave').onclick=()=>{state.schedule[hour]=state.schedule[hour]||{};state.schedule[hour][day]={work:document.getElementById('schWork').value.trim(),description:document.getElementById('schDesc').value.trim()};save();closeModal();openSchedule();toast(c.work?'Arbeitsplan aktualisiert.':'Arbeitsplan gespeichert.','success')};document.getElementById('schDelete').onclick=()=>{if(state.schedule[hour])delete state.schedule[hour][day];save();closeModal();openSchedule();toast('Arbeitsplan-Eintrag gelöscht.','success')}}refreshIcons()}
function taskItemHtml(t,owner){return `<div class="item" data-task="${t.id}"><div class="left">${icon(t.status?.[me().id]==='Ja'?'check-circle-2':'list-checks',20)}<div><div class="title">${esc(t.title)}</div><div class="meta">${esc(t.description||'Keine Beschreibung')} • ${t.items?.length||1} Aufgabe(n)</div></div></div><div class="right">${t.status?.[me().id]==='Ja'?'<span class="pill green">Erledigt</span>':'<span class="pill">Nicht erledigt</span>'}${owner?`<button class="icon-btn" data-edit-task="${t.id}">${icon('pencil',15)}</button><button class="icon-btn" data-delete-task="${t.id}">${icon('trash-2',15)}</button>`:''}${icon('chevron-right',16)}</div></div>`}
function tasksView(){let owner=me().username===OWNER||canManage();let pending=state.tasks.filter(t=>t.status?.[me().id]!=='Ja'),done=state.tasks.filter(t=>t.status?.[me().id]==='Ja');return `<div class="page-head"><div><h1>Aufgaben</h1><p>Unerledigte Aufgaben stehen oben, erledigte Aufgaben unten.${owner?' Du kannst Aufgaben erstellen und verwalten.':''}</p></div>${owner?`<button class="primary" id="addTask">${icon('plus',17)}</button>`:''}</div><div class="tabs" style="margin-bottom:16px"><div class="tab active">${icon('circle-alert',13)} Nicht erledigt <span class="muted">${pending.length}</span></div><div class="tab">${icon('check-circle-2',13)} Erledigt <span class="muted">${done.length}</span></div></div><div class="section-title" style="margin-top:0"><h2>Nicht erledigt</h2></div><div class="list">${pending.map(t=>taskItemHtml(t,owner)).join('')||'<div class="empty">Keine offenen Aufgaben.</div>'}</div><div class="section-title"><h2>Erledigt</h2></div><div class="list">${done.map(t=>taskItemHtml(t,owner)).join('')||'<div class="empty">Noch keine erledigten Aufgaben.</div>'}</div>`}
function openTaskCreator(editId=null){let existing=editId?state.tasks.find(x=>x.id===editId):null;taskDraftCount=existing?.items?.length||1;openModal(`<div class="modal"><div class="handle"></div><div class="modal-head"><h2>${existing?'Aufgabe bearbeiten':'Aufgabe erstellen'}</h2><button class="close" data-close>${icon('x',17)}</button></div><div class="field"><label>Anzahl der Aufgaben:</label><select id="taskCount" class="input">${Array.from({length:20},(_,i)=>`<option value="${i+1}" ${i+1===taskDraftCount?'selected':''}>${i+1}</option>`).join('')}</select></div><div id="taskFields" style="margin-top:12px"></div><div class="form-actions"><button class="primary" id="saveTask">${icon('save',16)} Aufgabe erstellen</button></div></div>`);const draw=()=>{let n=+document.getElementById('taskCount').value;document.getElementById('taskFields').innerHTML=Array.from({length:n},(_,i)=>{let it=existing?.items?.[i]||{};return `<div class="card" style="margin-bottom:10px"><div class="field"><label>Aufgabe: ${i+1}</label><input class="input tf-title" value="${esc(it.title||'')}"></div><div class="field"><label>Beschreibung:</label><textarea class="textarea tf-desc">${esc(it.description||'')}</textarea></div></div>`}).join('')};document.getElementById('taskCount').onchange=draw;draw();document.getElementById('saveTask').onclick=()=>{let titles=[...document.querySelectorAll('.tf-title')],descs=[...document.querySelectorAll('.tf-desc')];if(titles.some(x=>!x.value.trim()))return toast('Bitte jede Aufgabe ausfüllen.','danger');let t=existing||{id:uid(),status:{},createdAt:now()};t.title=titles[0].value.trim();t.description=descs[0].value.trim();t.items=titles.map((x,i)=>({title:x.value.trim(),description:descs[i].value.trim()}));if(!existing)state.tasks.unshift(t);save();closeModal();renderView();toast(existing?'Aufgabe aktualisiert.':'Aufgabe erstellt.','success')};refreshIcons()}
function openTaskDetail(id){let t=state.tasks.find(x=>x.id===id);if(!t)return;let u=me();openModal(`<div class="modal center"><div class="modal-head"><h2>${esc(t.title)}</h2><button class="close" data-close>${icon('x',17)}</button></div><div class="stack">${t.items.map((it,i)=>`<div class="card"><div style="font-weight:650;font-size:13px">${i+1}. ${esc(it.title)}</div><div class="muted small" style="margin-top:5px">${esc(it.description||'')}</div></div>`).join('')}<div class="field"><label>Aufgabe erledigt?</label><select id="taskStatus" class="input"><option ${t.status?.[u.id]!=='Ja'?'selected':''}>Nein</option><option ${t.status?.[u.id]==='Ja'?'selected':''}>Ja</option></select></div><button id="saveTaskStatus" class="primary">${icon('save',16)} Speichern</button></div></div>`);document.getElementById('saveTaskStatus').onclick=()=>{t.status=t.status||{};t.status[u.id]=document.getElementById('taskStatus').value;save();closeModal();toast('Aufgaben Status gespeichert.','success');renderView()};refreshIcons()}
function reportsView(){let owner=me().username===OWNER;return `<div class="page-head"><div><h1>Berichte</h1><p>Beiträge erscheinen hier mit Icon, Titel, Inhalt und Autor.</p></div>${owner?`<button class="primary" id="addReport">${icon('plus',17)}</button>`:''}</div><div class="list">${state.reports.map(r=>`<div class="item" data-report="${r.id}"><div class="left">${icon(r.icon||'file-text',22)}<div><div class="title">${esc(r.title)}</div><div class="meta">von ${esc(r.author)}</div></div></div><div class="right">${owner?`<button class="icon-btn" data-delete-report="${r.id}" title="Bericht löschen">${icon('trash-2',15)}</button>`:''}${icon('chevron-right',16)}</div></div>`).join('')||'<div class="empty">Noch keine Berichte.</div>'}</div>`}
function openReportCreator(){selectedReportIcon='circle-alert';openModal(`<div class="modal"><div class="handle"></div><div class="modal-head"><h2>Bericht erstellen</h2><button class="close" data-close>${icon('x',17)}</button></div><div class="stack"><div class="field"><label>Bericht Title</label><input id="rTitle" class="input"></div><div class="field"><label>Inhalt</label><textarea id="rContent" class="textarea"></textarea></div><div class="field"><label>Wähle ein Icon</label><div class="icon-grid" id="iconGrid">${ICONS.slice(0,64).map(n=>`<button class="icon-choice ${n===selectedReportIcon?'selected':''}" data-icon="${n}" title="${n}">${icon(n,19)}</button>`).join('')}</div></div><button id="saveReport" class="primary">${icon('save',16)} Speichern</button></div></div>`);document.querySelectorAll('[data-icon]').forEach(b=>b.onclick=()=>{selectedReportIcon=b.dataset.icon;document.querySelectorAll('[data-icon]').forEach(x=>x.classList.toggle('selected',x.dataset.icon===selectedReportIcon))});document.getElementById('saveReport').onclick=()=>{let title=document.getElementById('rTitle').value.trim(),content=document.getElementById('rContent').value.trim();if(!title||!content)return toast('Titel und Inhalt ausfüllen.','danger');state.reports.unshift({id:uid(),title,content,icon:selectedReportIcon,author:me().username,createdAt:now()});save();closeModal();renderView();toast('Bericht gespeichert.','success')};refreshIcons()}
function openReport(id){let r=state.reports.find(x=>x.id===id);openModal(`<div class="modal center"><div class="modal-head"><h2>${icon(r.icon,18)} ${esc(r.title)}</h2><button class="close" data-close>${icon('x',17)}</button></div><div class="card"><div style="white-space:pre-wrap;line-height:1.6;font-size:13px">${esc(r.content)}</div><div class="muted small" style="margin-top:14px">Gepostet von ${esc(r.author)}</div></div></div>`);refreshIcons()}
function adminView(){if(!isElevated())return `<div class="page-head"><div><h1>Mehr</h1><p>Dein Account hat keinen Zugriff auf das Admin Panel.</p></div></div><div class="card empty">${icon('shield-x',28)}<div style="margin-top:10px">Kein Admin-Zugriff.</div></div>`;return `<div class="page-head"><div><h1>Admin Panel</h1><p>Rollen, Beitritts-Codes und Benutzer verwalten.</p></div></div><div class="tabs"><button class="tab ${adminTab==='status'?'active':''}" data-admin-tab="status">Admin Status</button><button class="tab ${adminTab==='codes'?'active':''}" data-admin-tab="codes">Beitritts Code</button><button class="tab ${adminTab==='users'?'active':''}" data-admin-tab="users">Usern</button></div><div style="margin-top:15px" id="adminBody">${adminTab==='status'?adminStatus():adminTab==='codes'?adminCodes():adminUsers()}</div>`}
function adminStatus(){if(!canManage())return '<div class="card empty">Nur Owner und Manager können Rollen verwalten.</div>';return `<div class="page-head" style="margin-top:14px"><div><h2 style="font-size:18px;margin:0">Rollen</h2></div><button class="primary" id="adminRoleAdd">${icon('plus',16)}</button></div><div class="list">${state.users.map(u=>`<div class="item"><div class="left">${avatar(u,38)}<div><div class="title">${esc(u.username)}</div><div class="meta">Aktuell: ${esc(u.role)}</div></div></div><div class="right"><select class="input role-select" data-user="${u.id}" style="width:140px;padding:8px 10px"><option ${u.role==='User'?'selected':''}>User</option><option ${u.role==='Admin'?'selected':''}>Admin</option><option ${u.role==='Manager'?'selected':''}>Manager</option><option ${u.role==='Owner'?'selected':''}>Owner</option></select><button class="ghost role-save" data-user="${u.id}">${icon('save',14)} Speichern</button></div></div>`).join('')}</div>`}
function adminCodes(){if(!canManage())return '<div class="card empty">Nur Manager und Owner können Beitritts-Codes erstellen.</div>';return `<div class="page-head" style="margin-top:14px"><div><h2 style="font-size:18px;margin:0">Beitritts-Code</h2><p>Maximal 5 Ziffern. Nach der Registrierung ist ein Code automatisch ungültig.</p></div><button class="primary" id="newCode">${icon('plus',16)}</button></div><div class="list">${state.codes.map(c=>`<div class="item"><div class="left">${icon('key-round',20)}<div><div class="title" style="letter-spacing:2px">${esc(c.code)}</div><div class="meta">Benutzername: ${esc(c.username||'frei')} • Status: <span class="red">${c.used?'Benutzt.':'Nicht benutzt.'}</span></div></div></div><div class="right"><button class="icon-btn" data-delete-code="${c.id}">${icon('trash-2',15)}</button></div></div>`).join('')||'<div class="empty">Noch keine Codes.</div>'}</div>`}
function openCodeCreator(){openModal(`<div class="modal center"><div class="modal-head"><h2>Code erstellen</h2><button class="close" data-close>${icon('x',17)}</button></div><div class="stack"><div class="field"><label>Benutzernamen</label><input id="codeUser" class="input" placeholder="Benutzername"></div><div class="field"><label>Code</label><input id="codeValue" class="input" inputmode="numeric" maxlength="5" placeholder="max. 5 Ziffern"></div><button id="saveCode" class="primary btn-wide">${icon('key-round',16)} Code einrichten</button></div></div>`);document.getElementById('saveCode').onclick=async()=>{let username=document.getElementById('codeUser').value.trim(),code=document.getElementById('codeValue').value.trim();if(!username||!/^[0-9]{1,5}$/.test(code))return toast('Benutzernamen und einen Code mit 1–5 Ziffern eingeben.','danger');await pullRemoteState();if(state.users.some(u=>u.username.toLowerCase()===username.toLowerCase()))return toast('Benutzername ist bereits vergeben.','danger');if(state.codes.some(c=>c.code===code&&!c.used))return toast('Dieser Code ist bereits aktiv.','danger');state.codes.unshift({id:uid(),code,username,used:false,createdAt:now()});localStorage.setItem('ar_workspace_state',JSON.stringify(state));const ok=await pushRemoteState();if(!ok)return toast('Code konnte nicht zu Firebase gespeichert werden. Prüfe die Realtime-Database-Regeln.','danger');closeModal();renderView();toast('Code wurde eingerichtet.','success')};refreshIcons()}

function adminUsers(){return `<div class="page-head" style="margin-top:14px"><div><h2 style="font-size:18px;margin:0">Benutzer</h2></div></div><div class="list">${state.users.map(u=>`<div class="card"><div class="item" style="border:0;padding:0;background:transparent"><div class="left">${avatar(u,44)}<div><div class="title">${esc(u.username)}</div><div class="meta">Passwort • Rolle: ${esc(u.role)}${u.suspended?' • GESPERRT':''}</div></div></div><span class="pill">${u.warnings?.length||0} Warnungen</span></div><div class="form-actions">${canManage()?`<button class="ghost" data-suspend="${u.id}">${icon('ban',15)} ${u.suspended?'Entsperren':'Benutzer sperren'}</button><button class="danger" data-delete-user="${u.id}">${icon('user-x',15)} Benutzer löschen</button>`:''}<button class="ghost" data-warn="${u.id}">${icon('triangle-alert',15)} Warn hinzufügen</button>${canDeleteWarn()&&u.warnings?.length?`<button class="ghost" data-delete-warn-open="${u.id}">${icon('trash-2',15)} Warn löschen</button>`:''}</div></div>`).join('')}</div>`}
function openWarnDelete(userId){let u=state.users.find(x=>x.id===userId);if(!u||!u.warnings?.length)return toast('Keine Warnungen vorhanden.','danger');let selected=u.warnings[0];openModal(`<div class="modal center"><div class="modal-head"><h2>Warn löschen</h2><button class="close" data-close>${icon('x',17)}</button></div><div class="stack"><div class="field"><label>Warn auswählen</label><select id="warnDeleteSelect" class="input">${u.warnings.map((w,i)=>`<option value="${w.id}">${i+1}. ${esc(w.title)}</option>`).join('')}</select></div><div id="warnDeletePreview">${warnPreview(selected)}</div><button id="deleteWarn" class="danger btn-wide">${icon('trash-2',16)} Warn löschen</button></div></div>`);const select=document.getElementById('warnDeleteSelect');const preview=document.getElementById('warnDeletePreview');select.onchange=()=>{selected=u.warnings.find(w=>w.id===select.value)||u.warnings[0];preview.innerHTML=warnPreview(selected);refreshIcons()};document.getElementById('deleteWarn').onclick=()=>{let id=select.value;u.warnings=(u.warnings||[]).filter(w=>w.id!==id);save();closeModal();renderView();toast('Warn gelöscht.','success')};refreshIcons()}
function warnPreview(w){return `<div class="card warn-card"><div class="left" style="display:flex;gap:12px;align-items:flex-start">${icon(w.icon||'circle-alert',24)}<div><div class="title">${esc(w.title)}</div><div class="meta" style="margin-top:7px">${esc(w.description)}</div></div></div></div>`}
function openAllWarns(userId){let u=state.users.find(x=>x.id===userId)||me();let warns=u?.warnings||[];if(!warns.length)return;if(warns.length===1)return;openModal(`<div class="modal"><div class="handle"></div><div class="modal-head"><h2>Warnungen</h2><button class="close" data-close>${icon('x',17)}</button></div><p class="muted small">${warns.length} Warnungen für ${esc(u.username)}.</p><div class="list">${warns.map((w,i)=>`<div class="item warn-card"><div class="left">${icon(w.icon||'circle-alert',21)}<div><div class="title">${esc(w.title)}</div><div class="meta">${esc(w.description)}</div><div class="warn-num">(${i+1}/${warns.length})</div></div></div></div>`).join('')}</div></div>`);refreshIcons()}

function openWarn(userId){let u=state.users.find(x=>x.id===userId);selectedReportIcon='triangle-alert';openModal(`<div class="modal center"><div class="modal-head"><h2>Warn erstellen</h2><button class="close" data-close>${icon('x',17)}</button></div><div class="stack"><div class="field"><label>Warn Title:</label><input id="wTitle" class="input"></div><div class="field"><label>Warn beschreibung:</label><textarea id="wDesc" class="textarea"></textarea></div><div class="field"><label>Icon</label><div class="icon-grid" id="warnIcons">${ICONS.slice(0,48).map(n=>`<button class="icon-choice ${n==='triangle-alert'?'selected':''}" data-wicon="${n}">${icon(n,18)}</button>`).join('')}</div></div><button class="primary" id="createWarn">${icon('triangle-alert',16)} Warn erstellen</button></div></div>`);let wi='triangle-alert';document.querySelectorAll('[data-wicon]').forEach(b=>b.onclick=()=>{wi=b.dataset.wicon;document.querySelectorAll('[data-wicon]').forEach(x=>x.classList.toggle('selected',x.dataset.wicon===wi))});document.getElementById('createWarn').onclick=()=>{let title=document.getElementById('wTitle').value.trim(),desc=document.getElementById('wDesc').value.trim();if(!title||!desc)return toast('Titel und Beschreibung ausfüllen.','danger');u.warnings=u.warnings||[];u.warnings.push({id:uid(),title,description:desc,icon:wi,createdAt:now()});save();closeModal();renderView();toast('Warnung erstellt.','success')};refreshIcons()}
function openSettings(){let u=me();openModal(`<div class="modal"><div class="handle"></div><div class="modal-head"><h2>Einstellungen</h2><button class="close" data-close>${icon('x',17)}</button></div><div class="card"><div class="setting-row"><div><b>Profilbild</b><div class="muted small">Profilbild aktualisieren</div></div><label class="primary" style="cursor:pointer">${icon('image',15)} Aktualisieren<input id="profileUpload" type="file" accept="image/*" hidden></label></div><div class="setting-row"><div><b>Benutzernamen</b><div class="muted small">${esc(u.username)}</div></div><button class="ghost" id="changeName">${icon('pencil',15)} Benutzername ändern</button></div><div class="setting-row"><div><b>Passwort</b><div class="muted small">${u.password?'Gesichert gespeichert':''}</div></div><button class="ghost eye" id="showPass">${icon('eye',15)} Passwort anzeigen</button></div><div class="setting-row"><div><b>Passwort ändern</b></div><button class="ghost" id="changePass">${icon('key-round',15)} Ändern</button></div></div><div class="form-actions"><button class="ghost" id="settingsCard">${icon('badge-check',15)} Ausweis öffnen</button><button class="ghost" id="settingsLogout">${icon('log-out',15)} Ausloggen</button><button class="danger" id="deleteAccount">${icon('user-x',15)} Account löschen</button></div></div>`);document.getElementById('profileUpload').onchange=e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{u.profile=rd.result;save();closeModal();renderApp();toast('Profilbild aktualisiert.','success')};rd.readAsDataURL(f)};document.getElementById('changeName').onclick=()=>openChangeName();document.getElementById('changePass').onclick=()=>openChangePassword();document.getElementById('showPass').onclick=()=>{const b=document.getElementById('showPass');const visible=b.dataset.visible==='1';if(visible){b.dataset.visible='0';b.innerHTML=icon('eye',15)+' Passwort anzeigen';b.removeAttribute('title');}else{if(!u.passwordPlain)return toast('Für diesen Account ist kein gespeichertes Passwort zum Anzeigen vorhanden.','danger');b.dataset.visible='1';b.innerHTML=icon('eye-off',15)+' Passwort verstecken';b.title=u.passwordPlain;toast('Passwort: '+u.passwordPlain,'success');}refreshIcons()};document.getElementById('settingsLogout').onclick=logout;document.getElementById('settingsCard').onclick=()=>{closeModal();openIdCard()};document.getElementById('deleteAccount').onclick=()=>{if(confirm('Account wirklich löschen? Diese lokale Demo entfernt deinen Nutzer dauerhaft.')){state.users=state.users.filter(x=>x.id!==u.id);state.current=null;save();closeModal();renderAuthScreen('register')}};refreshIcons()}
function openChangeName(){let u=me();openModal(`<div class="modal center"><div class="modal-head"><h2>Benutzername ändern</h2><button class="close" data-close>${icon('x',17)}</button></div><div class="stack"><div class="field"><label>Neuer Benutzername</label><input id="newName" class="input" value="${esc(u.username)}"></div><button id="saveName" class="primary">${icon('save',15)} Benutzername ändern</button></div></div>`);document.getElementById('saveName').onclick=()=>{let n=document.getElementById('newName').value.trim();if(!n)return toast('Benutzername fehlt.','danger');if(state.users.some(x=>x.id!==u.id&&x.username.toLowerCase()===n.toLowerCase()))return toast('Benutzername ist bereits vergeben.','danger');u.username=n;save();closeModal();renderApp();toast('Benutzername geändert.','success')};refreshIcons()}
function openChangePassword(){openModal(`<div class="modal center"><div class="modal-head"><h2>Passwort ändern</h2><button class="close" data-close>${icon('x',17)}</button></div><div class="stack"><div class="field"><label>Neues Passwort</label><input id="cp" class="input" type="password"></div><button class="primary" id="sp">${icon('save',15)} Passwort ändern</button></div></div>`);document.getElementById('sp').onclick=async()=>{let p=document.getElementById('cp').value;if(p.length<6)return toast('Mindestens 6 Zeichen.','danger');me().password=await hash(p);me().passwordPlain=p;save();closeModal();toast('Passwort geändert.','success')};refreshIcons()}
function openIdCard(){let u=me();openModal(`<div class="modal center"><div class="modal-head"><h2>Ausweis</h2><button class="close" data-close>${icon('x',17)}</button></div><div class="idcard"><div class="id-stripe"></div><div class="id-top"><div><div class="id-chip">AR WORKSPACE</div><div style="font-size:10px;margin-top:5px;color:#303742">IDENTITY CARD</div></div><div class="id-chip">${esc(u.idNo)}</div></div><div class="id-row"><div><div class="id-label">Benutzername</div><div class="id-value">${esc(u.username)}</div></div><div><div class="id-label">Ausweis-ID</div><div class="id-value">${esc(u.idNo)}</div></div></div><div class="id-photo">${u.profile?`<img src="${u.profile}" alt="Profilbild">`:'Profilbild'}</div></div></div>`);refreshIcons()}
function visibleAbsences(){let u=me();return state.absences.filter(a=>!a.private||a.userId===u.id||u.role==='Owner'||u.role==='Manager'||u.role==='Admin')}
function openAbsence(){openModal(`<div class="modal center"><div class="modal-head"><h2>Abwesenheit</h2><button class="close" data-close>${icon('x',17)}</button></div><div class="stack"><div class="field"><label>Abwesenheits grund:</label><input id="aReason" class="input"></div><div class="field"><label>Wie lange bist du abwesend?</label><div class="muted small">Abwesend bis:</div><input id="aUntil" class="input" type="date"></div><div class="field"><label>Private Abwesenheit?</label><select id="aPrivate" class="input"><option>Nein</option><option>Ja</option></select></div><button id="saveAbs" class="primary">${icon('save',15)} Speichern</button></div></div>`);document.getElementById('saveAbs').onclick=()=>{let reason=document.getElementById('aReason').value.trim(),until=document.getElementById('aUntil').value,priv=document.getElementById('aPrivate').value==='Ja';if(!reason||!until)return toast('Grund und Datum ausfüllen.','danger');state.absences.unshift({id:uid(),userId:me().id,username:me().username,reason,until,private:priv});save();closeModal();toast('Abwesenheit gespeichert.','success');renderView()};refreshIcons()}
function folderIconChoices(selected){const names=['folder','folder-open','folder-plus','folder-down','folder-up','folder-pen','folder-check','folder-heart','folder-tree','folder-search','folder-cog','folder-x','briefcase-business','archive'];return names.map(n=>`<button type="button" class="folder-icon-choice ${n===selected?'selected':''}" data-ficon="${n}">${icon(n,19)}</button>`).join('')}
function fileIconFor(file){const t=file?.type||'';if(t.startsWith('image/'))return 'file-image';if(t.startsWith('video/'))return 'file-video';if(t.startsWith('text/'))return 'file-text';return 'file'}
function humanSize(n){if(!n)return '';let u=['B','KB','MB','GB'],i=Math.min(Math.floor(Math.log(n)/Math.log(1024)),u.length-1);return `${(n/Math.pow(1024,i)).toFixed(i?1:0)} ${u[i]}`}
function openFolders(){openModal(`<div class="modal"><div class="handle"></div><div class="modal-head"><h2>Ordners</h2><button class="close" data-close>${icon('x',17)}</button></div><div class="page-head" style="margin-bottom:12px"><div><p>Ordner und Dateien werden nur lokal in diesem Browser gespeichert.</p></div><button class="primary" id="newFolder">${icon('folder-plus',15)} Hinzufügen</button></div><div class="list">${state.folders.map(f=>`<div class="item" data-folder="${f.id}" style="cursor:pointer"><div class="left">${icon(f.icon||'folder',21)}<div><div class="title">${esc(f.name)}</div><div class="meta">${f.files?.length||0} Datei(en)</div></div></div><div class="right">${icon('chevron-right',15)}</div></div>`).join('')||'<div class="empty">Noch keine Ordner.</div>'}</div></div>`);document.getElementById('newFolder').onclick=()=>openFolderEditor();document.querySelectorAll('[data-folder]').forEach(x=>x.onclick=()=>openFolderContent(x.dataset.folder));refreshIcons()}
function openFolderEditor(id=null){let f=id?state.folders.find(x=>x.id===id):{id:uid(),name:'',icon:'folder',files:[]};if(!f)return;let choices=['folder','folder-open','folder-plus','folder-down','folder-up','folder-pen','folder-check','folder-heart','folder-tree','folder-search','folder-cog','folder-x','briefcase-business','archive'];openModal(`<div class="modal center"><div class="modal-head"><h2>${id?'Ordner bearbeiten':'Hinzufügen'}</h2><button class="close" data-close>${icon('x',17)}</button></div><div class="stack"><div class="field"><label>Ordner name</label><input id="fName" class="input" value="${esc(f.name)}"></div><div class="field"><label>Icon auswählen</label><div class="folder-icons" id="folderIcons">${folderIconChoices(f.icon||'folder')}</div></div><div class="form-actions">${id?`<button id="deleteFolder" class="danger">${icon('trash-2',15)} Ordner löschen</button>`:''}<button id="saveFolder" class="primary">${icon('save',15)} Speichern</button></div></div></div>`);let chosen=f.icon||'folder';document.querySelectorAll('[data-ficon]').forEach(b=>b.onclick=()=>{chosen=b.dataset.ficon;document.querySelectorAll('[data-ficon]').forEach(x=>x.classList.toggle('selected',x.dataset.ficon===chosen))});if(id)document.getElementById('deleteFolder').onclick=()=>{state.folders=state.folders.filter(x=>x.id!==id);save();closeModal();toast('Ordner gelöscht.','success');openFolders()};document.getElementById('saveFolder').onclick=()=>{let name=document.getElementById('fName').value.trim();if(!name)return toast('Ordnername fehlt.','danger');f.name=name;f.icon=chosen;if(!id)state.folders.unshift(f);save();closeModal();toast('Ordner gespeichert.','success');openFolders()};refreshIcons()}
function openFolderContent(id){let f=state.folders.find(x=>x.id===id);if(!f)return;openModal(`<div class="modal"><div class="handle"></div><div class="modal-head"><div style="display:flex;align-items:center;gap:9px">${icon(f.icon||'folder',21)}<h2>${esc(f.name)}</h2></div><button class="close" data-close>${icon('x',17)}</button></div><div class="page-head" style="margin-bottom:12px"><div><p>${f.files?.length||0} Datei(en) im Ordner.</p></div><div style="display:flex;gap:8px"><button class="ghost" id="editFolder">${icon('folder-pen',15)} Bearbeiten</button><button class="primary" id="addFolderFile">${icon('file-plus',15)} Inhalt erstellen</button></div></div><div class="file-list">${(f.files||[]).map(fileCardHtml).join('')||'<div class="empty">Noch keine Dateien. Drücke „Inhalt erstellen“.</div>'}</div></div>`);document.getElementById('editFolder').onclick=()=>openFolderEditor(f.id);document.getElementById('addFolderFile').onclick=()=>openFolderFilePicker(f.id);document.querySelectorAll('[data-delete-file]').forEach(b=>b.onclick=e=>{e.stopPropagation();f.files=f.files.filter(x=>x.id!==b.dataset.deleteFile);save();toast('Datei gelöscht.','success');openFolderContent(f.id)});document.querySelectorAll('[data-download-file]').forEach(b=>b.onclick=e=>{e.stopPropagation();let file=f.files.find(x=>x.id===b.dataset.downloadFile);if(file)downloadStoredFile(file)});refreshIcons()}
function fileCardHtml(file){const image=file.type?.startsWith('image/'),video=file.type?.startsWith('video/'),canPreview=image||video;return `<div class="file-chip" style="display:block"><div class="item" style="padding:0;border:0;background:transparent"><div class="file-main">${icon(fileIconFor(file),19)}<div><div class="file-name">${esc(file.name)}</div><div class="file-meta">${esc(file.type||'Datei')} ${file.size?'• '+humanSize(file.size):''}</div></div></div><div class="right"><button class="ghost" data-download-file="${file.id}" title="Datei herunterladen">${icon('download',14)} Herunterladen</button><button class="ghost" data-delete-file="${file.id}" title="Datei löschen">${icon('trash-2',14)}</button></div></div>${canPreview?`<div class="file-preview">${image?`<img src="${file.data}" alt="${esc(file.name)}" loading="lazy">`:`<video src="${file.data}" controls preload="metadata"></video>`}</div>`:'<div class="muted small" style="margin-top:8px">Keine Vorschau für dieses Format.</div>'}<button class="ghost" data-download-file="${file.id}" style="margin-top:9px">${icon('external-link',14)} Dateispeicherort</button></div>`}
function openFolderFilePicker(folderId){let f=state.folders.find(x=>x.id===folderId);if(!f)return;openModal(`<div class="modal center"><div class="modal-head"><h2>Inhalt erstellen</h2><button class="close" data-close>${icon('x',17)}</button></div><div class="stack"><div class="field"><label>Datei auswählen</label><input id="folderFileInput" class="input" type="file" multiple></div><div class="muted small">Bilder und Videos bekommen eine Vorschau. Andere Formate werden als Datei gespeichert.</div><button class="primary btn-wide" id="saveFolderFiles">${icon('save',15)} Speichern</button></div></div>`);document.getElementById('saveFolderFiles').onclick=async()=>{const input=document.getElementById('folderFileInput');if(!input.files.length)return toast('Bitte mindestens eine Datei auswählen.','danger');for(const file of input.files){f.files.push({id:uid(),name:file.name,type:file.type,size:file.size,data:await readFile(file)})}save();closeModal();toast('Datei(en) gespeichert.','success');openFolderContent(folderId)};refreshIcons()}
function downloadStoredFile(file){const a=document.createElement('a');a.href=file.data;a.download=file.name;document.body.appendChild(a);a.click();a.remove();toast('Datei-Download gestartet.','success')}
function readFile(file){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
function openModal(html){let root=document.getElementById('modalRoot');root.innerHTML=`<div class="modal-backdrop open" id="modalBackdrop">${html}</div>`;root.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);document.getElementById('modalBackdrop').onclick=e=>{if(e.target.id==='modalBackdrop')closeModal()};refreshIcons()}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function logout(){state.current=null;save();renderAuthScreen('login')}
function bindView(){if(view==='dashboard'){document.getElementById('scheduleBtn')?.addEventListener('click',openSchedule);document.getElementById('scheduleBtn2')?.addEventListener('click',openSchedule);document.getElementById('absenceBtn')?.addEventListener('click',openAbsence);document.getElementById('absenceTopBtn')?.addEventListener('click',openAbsence);document.getElementById('foldersBtn')?.addEventListener('click',openFolders);document.querySelectorAll('[data-delete-absence]').forEach(b=>b.onclick=e=>{e.stopPropagation();state.absences=state.absences.filter(x=>x.id!==b.dataset.deleteAbsence);save();renderView();toast('Abwesenheit gelöscht.','success')});document.querySelectorAll('[data-all-warns]').forEach(b=>b.onclick=e=>openAllWarns(b.dataset.allWarns))}if(view==='tasks'){document.getElementById('addTask')?.addEventListener('click',()=>openTaskCreator());document.querySelectorAll('[data-task]').forEach(x=>x.onclick=()=>openTaskDetail(x.dataset.task));document.querySelectorAll('[data-edit-task]').forEach(b=>b.onclick=e=>{e.stopPropagation();openTaskCreator(b.dataset.editTask)});document.querySelectorAll('[data-delete-task]').forEach(b=>b.onclick=e=>{e.stopPropagation();state.tasks=state.tasks.filter(x=>x.id!==b.dataset.deleteTask);save();renderView();toast('Aufgabe gelöscht.','success')})}if(view==='reports'){document.getElementById('addReport')?.addEventListener('click',openReportCreator);document.querySelectorAll('[data-report]').forEach(x=>x.onclick=e=>{if(!e.target.closest('[data-delete-report]'))openReport(x.dataset.report)});document.querySelectorAll('[data-delete-report]').forEach(b=>b.onclick=e=>{e.stopPropagation();state.reports=state.reports.filter(x=>x.id!==b.dataset.deleteReport);save();renderView();toast('Bericht gelöscht.','success')})}if(view==='more'){document.querySelectorAll('[data-admin-tab]').forEach(b=>b.onclick=()=>{adminTab=b.dataset.adminTab;renderView()});document.getElementById('adminRoleAdd')?.addEventListener('click',()=>{adminTab='status';document.querySelector('[data-admin-tab="status"]')?.click()});document.querySelectorAll('.role-save').forEach(b=>b.onclick=()=>{let u=state.users.find(x=>x.id===b.dataset.user);let role=document.querySelector(`.role-select[data-user="${b.dataset.user}"]`).value;if(u.username===OWNER&&role!=='Owner')return toast('Owner-Rolle kann nicht entfernt werden.','danger');u.role=role;save();renderView();toast('Rolle gespeichert.','success')});document.getElementById('newCode')?.addEventListener('click',openCodeCreator);document.querySelectorAll('[data-delete-code]').forEach(b=>b.onclick=()=>{state.codes=state.codes.filter(x=>x.id!==b.dataset.deleteCode);save();renderView();toast('Code gelöscht.','success')});document.querySelectorAll('[data-warn]').forEach(b=>b.onclick=()=>openWarn(b.dataset.warn));document.querySelectorAll('[data-delete-warn-open]').forEach(b=>b.onclick=()=>openWarnDelete(b.dataset.deleteWarnOpen));document.querySelectorAll('[data-suspend]').forEach(b=>b.onclick=()=>{let u=state.users.find(x=>x.id===b.dataset.suspend);if(u.username===OWNER)return toast('Owner kann nicht gesperrt werden.','danger');u.suspended=!u.suspended;if(u.suspended&&u.id===state.current)state.current=null;save();renderView();toast(u.suspended?'Benutzer gesperrt.':'Benutzer entsperrt.','success')});document.querySelectorAll('[data-delete-user]').forEach(b=>b.onclick=()=>{let u=state.users.find(x=>x.id===b.dataset.deleteUser);if(!u||u.username===OWNER)return toast('Owner kann nicht gelöscht werden.','danger');state.users=state.users.filter(x=>x.id!==u.id);save();renderView();toast('Benutzer gelöscht.','success')})}}

// Start the app after the DOM is ready.
document.addEventListener('DOMContentLoaded',async()=>{
  try {
    await pullRemoteState();
    renderAuth();
  } catch (err) {
    console.error('AR Workspace startup error:', err);
    const app=document.getElementById('app');
    if(app) app.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;padding:30px;color:#fff;font-family:system-ui;background:#0c0d10"><div style="max-width:640px"><h2 style="margin:0 0 8px">AR Workspace konnte nicht gestartet werden</h2><p style="color:#9aa2b1;line-height:1.5">Bitte Seite neu laden. Falls der Fehler bleibt, kann der lokale Browser-Speicher beschädigt sein.</p></div></div>';
  }
});
</script>
</body>
</html>
